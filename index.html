<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube exige un "Referer" pour les lecteurs integres (sinon erreur 152/153) -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ANF JukeBox - Lecteur</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
/* ==========================================================================
   ANF JUKEBOX - LECTEUR WEB v2 (meme fonctionnement que l'addon d'origine)
   - Page chargee UNE fois ; chaque musique est lancee dans le lecteur YouTube
     integre (cadre) par l'API -> YouTube n'y met quasiment jamais de pub.
   - Securite : le lecteur reste MUET tant que la vraie musique n'a pas demarre
     (si une pub passe quand meme, elle n'est pas entendue).
   - Synchro : se cale sur le temps du serveur envoye par le JukeBox (ANF_POS).
   Etat voulu envoye par GMod toutes les 0,3 s :
     ANF_SEQ / ANF_ID (musique voulue, '' = stop), ANF_POS + ANF_POS_AT (position
     attendue), ANF_END (fin), ANF_LEN (duree de la musique), ANF_VOL (0-100)
   Retours vers GMod : anfjb.Seen / Playing / Ad / Err (+ console.log)
   API classique gardee (apercus des menus) : JukeBox.PlayVideo... / player.*
   ========================================================================== */
(function () {
  "use strict";

  var yt = null, ready = false, pendingOpts = null;
  var wantPlaying = false, currentId = null, loadedSeq = null;
  var confirmed = false, lastT = -1, stuckSince = 0, lastSeek = 0;
  var playSent = false, adSent = false, retry = 0;
  if (window.ANF_VOL === undefined) window.ANF_VOL = 25;

  function send(m) { try { console.log(m); } catch (e) {} }
  function cb(fn, a) {
    try { if (window.anfjb && typeof window.anfjb[fn] === "function") window.anfjb[fn](a === undefined ? "" : String(a)); } catch (e) {}
  }
  function vol() { return Math.max(0, Math.min(100, Number(window.ANF_VOL) || 0)); }
  function expected() {
    if (typeof window.ANF_POS !== "number" || typeof window.ANF_POS_AT !== "number") return null;
    return window.ANF_POS + (performance.now() - window.ANF_POS_AT) / 1000;
  }

  function load(id, start, end) {
    if (!id) return;
    currentId = String(id).replace(/[^\w-]/g, "");
    wantPlaying = true; confirmed = false; lastT = -1; stuckSince = 0;
    playSent = false; adSent = false; retry = 0;
    var opts = { videoId: currentId };
    start = Number(start); end = Number(end);
    if (start > 0) opts.startSeconds = start;
    if (end > 0) opts.endSeconds = end;
    cb("Seen", navigator.userAgent);
    send("JBLOG:lecture " + JSON.stringify(opts));
    if (ready) { try { yt.mute(); } catch (e) {} yt.loadVideoById(opts); }
    else pendingOpts = opts;
  }

  function stop() {
    wantPlaying = false; confirmed = false; pendingOpts = null;
    if (ready) { try { yt.stopVideo(); } catch (e) {} }
  }

  // NB : on ne se fie PAS a getPlayerState() (YouTube renvoie parfois -1 alors que la video joue) :
  // on regarde si la position AVANCE vraiment.
  var advCount = 0;
  function loop() {
    // Etat voulu envoye par GMod
    if (typeof window.ANF_SEQ === "number" && window.ANF_SEQ !== loadedSeq) {
      loadedSeq = window.ANF_SEQ;
      if (window.ANF_ID) { var ex = expected(); load(window.ANF_ID, ex === null ? 0 : Math.max(0, ex), window.ANF_END); advCount = 0; }
      else stop();
    }
    if (!ready || !wantPlaying) return;

    var cur, dur;
    try { cur = yt.getCurrentTime(); dur = yt.getDuration(); } catch (e) { return; }
    var now = performance.now();
    var L = Number(window.ANF_LEN) || 0;
    var durOk = !(L > 20 && dur > 0 && dur < L * 0.8 && (L - dur) > 5);
    var adv = lastT >= 0 && cur > lastT + 0.05 && cur - lastT < 2;   // la lecture avance
    if (adv) { advCount++; stuckSince = 0; } else { advCount = 0; if (!stuckSince) stuckSince = now; }
    lastT = cur;

    if (!confirmed) {
      try { if (!yt.isMuted()) yt.mute(); } catch (e) {}
      if (durOk && advCount >= 2) {
        confirmed = true;                        // la vraie musique avance -> on peut remettre le son
      } else {
        if (dur > 0 && (!durOk || now - stuckSince > 2500) && !adSent) { adSent = true; cb("Ad"); send("JBLOG:pub detectee (reste muette)"); }
        if (stuckSince && now - stuckSince > 3000) { retry++; if (retry % 8 === 0) { try { yt.playVideo(); } catch (e) {} } }
        return;
      }
    }

    if (!durOk) { confirmed = false; advCount = 0; return; }   // pub en cours de musique : on recoupe

    var e = Number(window.ANF_END) || 0;
    if (e > 0 && cur >= e) { try { yt.pauseVideo(); } catch (er) {} wantPlaying = false; return; }

    var exp = expected();
    if (exp !== null && Math.abs(cur - exp) > 1.5 && now - lastSeek > 4000 && (!(dur > 0) || exp < dur - 1)) {
      lastSeek = now;
      try { yt.seekTo(exp, true); } catch (er) {}
    }
    if (stuckSince && now - stuckSince > 3000) { try { yt.playVideo(); } catch (er) {} stuckSince = now; }

    var v = vol();
    try {
      if (yt.getVolume() !== v) yt.setVolume(v);
      if (v > 0) { if (yt.isMuted()) yt.unMute(); } else if (!yt.isMuted()) yt.mute();
    } catch (er) {}
    if (!playSent) { playSent = true; cb("Playing"); send("JBPLAYING"); }
  }

  // ----- API classique (utilisee par les apercus des menus) -----
  window.JukeBox = {
    __anf: 2,
    PlayVideo:          function (id)             { load(id, 0, 0); },
    PlayVideoFrom:      function (id, start)      { load(id, start, 0); },
    PlayVideoUntil:     function (id, end)        { load(id, 0, end); },
    PlayVideoFromUntil: function (id, start, end) { load(id, start, end); },
    StopVideo:          function ()               { stop(); },
    SetVolume:          function (v)              { v = Number(v); if (!isNaN(v)) window.ANF_VOL = Math.max(0, Math.min(100, v)); }
  };
  window.player = {
    loadVideoById: function (a, b) {
      if (typeof a === "object") load(a.videoId, a.startSeconds, a.endSeconds); else load(a, b, 0);
    },
    setVolume:  function (v) { window.JukeBox.SetVolume(v); },
    stopVideo:  function ()  { stop(); },
    playVideo:  function ()  { wantPlaying = true; if (ready) { try { yt.playVideo(); } catch (e) {} } },
    pauseVideo: function ()  { wantPlaying = false; if (ready) { try { yt.pauseVideo(); } catch (e) {} } }
  };

  window.onYouTubeIframeAPIReady = function () {
    var vars = { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1, enablejsapi: 1, mute: 1 };
    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    yt = new YT.Player("player", {
      width: "100%", height: "100%",
      host: "https://www.youtube-nocookie.com",
      playerVars: vars,
      events: {
        onReady: function () {
          ready = true;
          try { yt.mute(); } catch (e) {}
          if (pendingOpts) { var o = pendingOpts; pendingOpts = null; yt.loadVideoById(o); }
          send("JBREADY");
        },
        onError: function (ev) {
          cb("Err", "erreur YouTube " + (ev && ev.data));
          send("JBERR:" + (ev && ev.data) + ":" + (currentId || "?"));
        }
      }
    });
  };

  setInterval(loop, 250);
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { cb("Err", "API YouTube injoignable"); send("JBERR:NOAPI:" + (currentId || "?")); };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
