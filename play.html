<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ANF JukeBox</title>
</head>
<body style="margin:0;background:#000">
<script>
// Redirige vers le lecteur YouTube (avec un Referer valide, sinon erreur 153).
// Le JukeBox (client_player.lua) injecte ensuite le script qui saute les pubs.
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get("v") || "").replace(/[^\w-]/g, "");
  if (!id) return;
  var p = new URLSearchParams({ autoplay: "1", controls: "0", rel: "0", iv_load_policy: "3", playsinline: "1", fs: "0", disablekb: "1" });
  var s = Math.floor(parseFloat(q.get("start")) || 0);
  var e = Math.floor(parseFloat(q.get("end")) || 0);
  if (s > 0) p.set("start", s);
  if (e > 0) p.set("end", e);
  location.replace("https://www.youtube-nocookie.com/embed/" + id + "?" + p.toString());
})();
</script>
</body>
</html>
